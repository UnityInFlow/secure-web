# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# Any RUSTSEC advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
# An exception needs an `ignore` entry with a reason and a docs/backlog.md item.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The Mozilla CA root list bundled by `webpki-roots` (reqwest `rustls-tls`, PR-03) is data under
# CDLA-Permissive-2.0. Allowed for that crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[licenses.private]
# Workspace crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

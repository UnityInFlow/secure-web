[package]
name = "secure-web-mcp"
description = "MCP server and tools for Secure Web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# No dependency on secure-web-fetch / -security / -extract: every page goes through
# `secure_web_crawl::PageProcessor` (docs/architecture.md, CLAUDE.md "Rust conventions").
[dependencies]
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rmcp.workspace = true
secure-web-core.workspace = true
secure-web-crawl.workspace = true
secure-web-store.workspace = true
secure-web-search.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `net` for the listener, `signal` for graceful shutdown, `sync` for the call semaphore.
tokio = { workspace = true, features = ["net", "signal", "sync", "rt", "macros", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
